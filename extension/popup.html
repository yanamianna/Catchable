<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Catchable 本地助手</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <main>
    <div class="brand"><span class="mark">C</span><div><h1>Catchable</h1><p>连接当前 Chrome 登录会话</p></div></div>
    <section class="connection" aria-live="polite"><span id="status-dot" class="dot"></span><div><strong id="status-label">尚未连接</strong><p id="status-message">正在读取连接状态…</p></div></section>
    <p id="account-label" class="hint" hidden></p>
    <form id="connect-form">
      <label for="pairing-code">本地配对码</label>
      <input id="pairing-code" type="password" autocomplete="off" spellcheck="false" placeholder="从本地控制台复制后粘贴" maxlength="128">
      <p class="hint">从控制台的「登录设置」复制配对码。</p>
      <div class="actions"><button id="connect" type="submit">连接本地系统</button><button id="disconnect" type="button" class="secondary">断开</button></div>
    </form>
    <button id="open-console" class="console" type="button">打开本地控制台 <span aria-hidden="true">↗</span></button>
    <p class="scope">连接后在控制台核验登录，再启动任务。</p>
    <p id="error" class="error" role="alert" hidden></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
